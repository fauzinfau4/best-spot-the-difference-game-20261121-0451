<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Clockmaker's Workshop</title><style>
:root{color-scheme:dark;--ink:#f6e7c5;--gold:#e9bb73;--panel:#241c1a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#563d32,#171314 70%);color:var(--ink);font:15px/1.4 Georgia,serif;min-height:100vh;display:grid;place-items:center}.cabinet{width:min(1240px,98vw);padding:12px 18px 15px;background:linear-gradient(145deg,#38251f,#201717 45%,#38241e);border:1px solid #94704b;border-radius:14px;box-shadow:0 22px 75px #000b,inset 0 1px #d5a66a66}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 3px 9px}.brand{font-size:20px;letter-spacing:.04em;color:#f4d9aa}.tag{color:#be9c6e;font:11px/1.2 system-ui;letter-spacing:.2em;text-transform:uppercase}.hud{display:flex;align-items:center;gap:16px;font:13px system-ui;color:#ead7b5}.readout{min-width:75px}.readout b{color:#fff0ca;font-variant-numeric:tabular-nums}.bar{width:155px;height:7px;border-radius:6px;background:#120f10;overflow:hidden;border:1px solid #73563d}.bar i{display:block;height:100%;background:linear-gradient(90deg,#78a47d,#e6bd66);width:100%;transition:width .2s}.actions{display:flex;align-items:center;gap:7px}.actions button,.overlay button{border:1px solid #b58a54;background:linear-gradient(#72503b,#493328);color:#fff0d0;border-radius:7px;padding:7px 13px;cursor:pointer;font:600 12px system-ui;box-shadow:inset 0 1px #fff2}.actions button:hover,.overlay button:hover{filter:brightness(1.2)}button:disabled{opacity:.42;cursor:default}.canvasWrap{position:relative;border:1px solid #a47c50;border-radius:5px;overflow:hidden;background:#191617;box-shadow:inset 0 0 24px #000}.canvasWrap canvas{display:block;width:100%;height:auto;cursor:crosshair}.bottom{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 0;color:#bd9d76;font:11px system-ui;letter-spacing:.04em}.bottom strong{color:#e7cfaa}.mobileHint{display:none}@media(max-width:760px){.cabinet{padding:8px}.top{flex-wrap:wrap}.brand{font-size:16px}.hud{gap:7px;font-size:11px}.bar{width:80px}.readout{min-width:53px}.actions button{padding:6px 8px}.bottom{font-size:9px}}
</style></head><body><main class="cabinet"><header class="top"><div><div class="tag">An illustrated puzzle · three curious rooms</div><div class="brand">The Clockmaker's Workshop</div></div><div class="hud"><span class="readout">FOUND <b id="found">0 / 7</b></span><span class="readout">SCORE <b id="score">00000</b></span><span class="readout">TIME <b id="time">02:30</b></span><span class="bar"><i id="timerBar"></i></span></div><nav class="actions"><button id="hintBtn">Hint · 3</button><button id="pauseBtn">Pause</button><button id="muteBtn">Sound on</button></nav></header><section class="canvasWrap"><canvas id="game" width="1280" height="720" aria-label="Spot the difference game"></canvas><div id="overlay"></div></section><footer class="bottom"><span id="levelName">THE WORKSHOP · 1 / 3</span><span>Look closely, little by little. <strong>H hint · P pause · M sound · R restart</strong></span></footer></main><div id="selftest" hidden></div><script type="module" src="./src/main.js"></script></body></html>
